<style>
:root{
  --bg:#0A0A0B;
  --bg-1:#131316;
  --card:#1B1B1F;
  --card-2:#212126;
  --border:#2A2A2F;
  --text:#F3F1EC;
  --text-dim:#96969C;
  --text-faint:#5C5C62;
  --orange:#FF5A1F;
  --orange-dim:#E8480A;
  --orange-glow:rgba(255,90,31,.32);
  --green:#4ADE80;
  --red:#F0473A;
  --radius:16px;
  --radius-sm:10px;
  --font-display:'Bricolage Grotesque',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:15px;line-height:1.5;overscroll-behavior:none;
}
button,input,textarea,select{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--orange-glow);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

.hidden{display:none !important;}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;}
#app.ready{display:flex;}

.sidebar{
  display:none;width:230px;flex-shrink:0;background:var(--bg-1);
  border-right:1px solid var(--border);padding:28px 16px;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.sidebar .brand{
  font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.5px;
  padding:0 12px 28px;color:var(--text);
}
.sidebar .brand span{color:var(--orange);}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-weight:500;font-size:14px;transition:background .15s,color .15s;
}
.nav-item .ic{font-size:17px;width:20px;text-align:center;}
.nav-item.active{background:var(--card);color:var(--text);}
.nav-item.active .ic{color:var(--orange);}
.nav-item:hover{color:var(--text);}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);}

main{flex:1;min-width:0;padding:20px 18px 100px;max-width:640px;margin:0 auto;width:100%;}
@media (min-width:900px){
  .sidebar{display:flex;}
  main{padding:36px 40px 40px;max-width:760px;}
  .bottom-nav{display:none !important;}
}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;background:rgba(19,19,22,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:40;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);
  font-size:10px;font-weight:500;padding:4px 6px;border-radius:10px;transition:color .15s;min-width:44px;flex-shrink:0;}
.bn-item .ic{font-size:18px;}
.bn-item.active{color:var(--orange);}

/* ---------- TOP BAR ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.topbar h1{font-family:var(--font-display);font-weight:800;font-size:22px;}
.topbar .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;border:1px solid var(--border);}

@keyframes viewFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.topbar,.card,.quote-card,.project-card,.empty-state,.stat-card,.day-strip,.diary-nav,.scope-row,.hero-image,.ob-step{
  animation:viewFadeIn .45s cubic-bezier(.16,1,.3,1) both;
}
.card:nth-of-type(2){animation-delay:.04s;}
.card:nth-of-type(3){animation-delay:.08s;}
.card:nth-of-type(4){animation-delay:.12s;}

@keyframes checkPop{0%{transform:scale(.6);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
.check-btn.done{animation:checkPop .32s cubic-bezier(.34,1.56,.64,1);}
.t-item.done .t-dot{animation:checkPop .32s cubic-bezier(.34,1.56,.64,1);}

@keyframes flameBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
.flame-pulse{display:inline-block;animation:flameBreathe 2.4s ease-in-out infinite;}

.ring-progress{transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1);}

@keyframes confirmFlash{0%{background:var(--card-2);}40%{background:var(--green);color:#0A0A0B;}100%{background:var(--orange);color:#0A0A0B;}}
.btn.confirmed{animation:confirmFlash .8s ease;}

@keyframes barGrow{from{width:0;}}
.progress-fill{animation:barGrow 1s cubic-bezier(.16,1,.3,1);}

@keyframes iconPop{0%{transform:scale(.7);}60%{transform:scale(1.22);}100%{transform:scale(1);}}
.bn-item.active .ic,.nav-item.active .ic{animation:iconPop .32s cubic-bezier(.34,1.56,.64,1);}

/* ---------- COMPONENTS ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.card + .card{margin-top:12px;}
.section-title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--text-dim);margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;
  border-radius:12px;font-weight:600;font-size:14.5px;transition:transform .12s,opacity .12s;width:100%;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--orange);color:#0A0A0B;}
.btn-primary:hover{background:#ff6b34;}
.btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border);}
.btn-ghost{background:none;color:var(--text-dim);border:1px solid var(--border);}
.btn-danger{background:none;color:var(--red);border:1px solid rgba(240,71,58,.35);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;}

.progress-track{height:8px;border-radius:6px;background:var(--card-2);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange-dim),var(--orange));
  border-radius:6px;transition:width .5s ease;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
.stat-card .num{font-family:var(--font-mono);font-weight:600;font-size:24px;color:var(--text);}
.stat-card .lbl{font-size:11.5px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}
.stat-card .num.orange{color:var(--orange);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty-state .ic{font-size:30px;margin-bottom:10px;opacity:.6;}
.empty-state p{font-size:14px;margin-bottom:16px;}

.toast-wrap{position:fixed;bottom:90px;left:0;right:0;display:flex;justify-content:center;z-index:200;pointer-events:none;}
@media(min-width:900px){.toast-wrap{bottom:24px;}}
.toast{background:var(--card-2);border:1px solid var(--border);border-left:3px solid var(--orange);
  padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  animation:toastIn .25s ease;max-width:88vw;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:900px){.modal-backdrop{align-items:center;}}
.modal{background:var(--bg-1);border:1px solid var(--border);border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;animation:modalUp .22s ease;}
@media(min-width:900px){.modal{border-radius:20px;}}
@keyframes modalUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal h2{font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:16px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field input,.field textarea,.field select{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:16px;color:var(--text);
}
.field textarea{resize:vertical;min-height:80px;}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--orange);outline-offset:1px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 13px;border-radius:20px;background:var(--card-2);border:1px solid var(--border);
  font-size:12.5px;color:var(--text-dim);}
.chip.selected{background:var(--orange-glow);border-color:var(--orange);color:var(--orange);}

/* ---------- VISÃO ---------- */
.hero-image{position:relative;border-radius:var(--radius);overflow:hidden;height:230px;
  border:1px solid var(--border);background:var(--card);touch-action:pan-y;}
.hero-image .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;}
.hero-image .slide.active{opacity:1;}
.hero-image img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-image .add-btn{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);z-index:5;}
.hero-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:5;}
.hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;}
.hero-dots span.active{background:var(--orange);width:16px;border-radius:4px;}

.quote-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  position:relative;min-height:76px;display:flex;align-items:center;}
.quote-card .quote-text{font-family:var(--font-display);font-weight:700;font-size:16.5px;line-height:1.4;
  transition:opacity .3s ease;}
.quote-card .quote-idx{position:absolute;bottom:10px;right:14px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}

.day-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
.day-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 12px;
  border-radius:12px;background:var(--card);border:1px solid var(--border);min-width:52px;}
.day-chip.active{background:var(--orange-glow);border-color:var(--orange);}
.day-chip .dow{font-size:10px;color:var(--text-faint);text-transform:uppercase;}
.day-chip .dd{font-family:var(--font-mono);font-weight:600;font-size:14px;}
.day-chip .mark{width:5px;height:5px;border-radius:50%;background:var(--text-faint);}
.day-chip .mark.has{background:var(--orange);}
.day-chip.active .dow,.day-chip.active .dd{color:var(--orange);}

.diary-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.diary-nav .date-lbl{font-family:var(--font-display);font-weight:700;font-size:16px;}
.diary-nav button{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);font-size:15px;}
.diary-nav button:disabled{opacity:.3;}

.scope-row{display:flex;gap:8px;margin:14px 0;}
.scope-btn{flex:1;padding:10px 6px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  font-size:12.5px;color:var(--text-dim);text-align:center;font-weight:500;}
.scope-btn.active{background:var(--orange-glow);border-color:var(--orange);color:var(--orange);}

.ring-wrap{display:flex;align-items:center;gap:20px;}
.ring-num{font-family:var(--font-mono);font-weight:600;font-size:15px;fill:var(--text);}
.ring-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}

.dynamic-msg{border-left:3px solid var(--orange);padding:14px 16px;background:var(--card);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:14px;color:var(--text);font-weight:500;}

/* ---------- AGORA / TIMELINE ---------- */
.now-hero{text-align:center;padding:22px 10px 26px;}
.now-clock{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);letter-spacing:1px;}
.now-icon{font-size:34px;margin:10px 0 6px;}
.now-label{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.3px;}
.now-status{font-size:12.5px;color:var(--orange);margin-top:4px;font-weight:600;}

.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border);}
.t-item{position:relative;padding-bottom:22px;}
.t-item:last-child{padding-bottom:0;}
.t-dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--bg-1);
  border:2px solid var(--border);}
.t-item.done .t-dot{background:var(--green);border-color:var(--green);}
.t-item.now .t-dot{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 5px var(--orange-glow);
  animation:pulse 1.8s infinite;}
.t-item.missed .t-dot{background:var(--bg-1);border-color:var(--red);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--orange-glow);}50%{box-shadow:0 0 0 8px transparent;}}
.t-time{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);}
.t-item.now .t-time{color:var(--orange);}
.t-title{font-size:14.5px;font-weight:600;margin-top:2px;}
.t-item.done .t-title{color:var(--text-dim);}
.t-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:3px;display:block;}
.t-item.now .t-tag{color:var(--orange);}
.t-item.done .t-tag{color:var(--green);}
.t-item.missed .t-tag{color:var(--red);}

/* ---------- ACTIVITIES ---------- */
.activity-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);}
.activity-row:last-child{border-bottom:none;}
.check-btn{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;transition:.15s;}
.check-btn.done{background:var(--orange);border-color:var(--orange);color:#0A0A0B;}
.activity-info{flex:1;min-width:0;}
.activity-info .name{font-weight:600;font-size:14.5px;}
.activity-info .name.done{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--text-faint);}
.activity-info .meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.weight-dots{display:flex;gap:3px;}
.weight-dots span{width:5px;height:5px;border-radius:50%;background:var(--border);}
.weight-dots span.on{background:var(--orange);}

/* ---------- DIARY ---------- */
.diary-block{margin-bottom:16px;}
.diary-block label{display:block;font-family:var(--font-display);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:8px;}
.diary-block textarea{width:100%;min-height:100px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px;font-size:16px;color:var(--text);}

.analysis-block{margin-bottom:14px;}
.analysis-block .h{font-family:var(--font-display);font-weight:700;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px;}
.analysis-block.good .h{color:var(--green);}
.analysis-block.improve .h{color:var(--red);}
.analysis-block.pattern .h{color:var(--text-dim);}
.analysis-block.reco .h{color:var(--orange);}
.analysis-block p{font-size:14px;line-height:1.55;color:var(--text);}

/* ---------- PROJECTS ---------- */
.project-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;}
.project-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.project-card .name{font-family:var(--font-display);font-weight:700;font-size:16.5px;}
.project-card .day-tag{font-family:var(--font-mono);font-size:11.5px;color:var(--orange);background:var(--orange-glow);
  padding:4px 9px;border-radius:8px;white-space:nowrap;}
.project-card .obj{font-size:13px;color:var(--text-dim);margin-bottom:12px;}
.mini-stats{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--text-dim);}
.mini-stats b{color:var(--text);font-family:var(--font-mono);}

/* ---------- SETTINGS ---------- */
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;
  border-bottom:1px solid var(--border);}
.settings-item:last-child{border-bottom:none;}
.settings-item .lbl{font-size:14.5px;font-weight:500;}
.settings-item .val{font-size:13px;color:var(--text-dim);}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.list-row .name{font-size:14px;font-weight:500;}
.list-row .actions button{font-size:12px;color:var(--text-dim);margin-left:12px;}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.img-grid .thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid transparent;}
.img-grid .thumb.main{border-color:var(--orange);}
.img-grid .thumb img{width:100%;height:100%;object-fit:cover;}
.img-grid .thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);width:20px;height:20px;
  border-radius:50%;font-size:11px;}
.conn-status{font-size:12.5px;padding:8px 12px;border-radius:8px;margin-top:8px;display:inline-block;}
.conn-status.ok{background:rgba(74,222,128,.12);color:var(--green);}
.conn-status.err{background:rgba(240,71,58,.12);color:var(--red);}

/* ---------- ONBOARDING ---------- */
#onboarding{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;
  padding:30px 22px calc(30px + env(safe-area-inset-bottom));}
.ob-progress{display:flex;gap:6px;margin-bottom:34px;}
.ob-progress span{flex:1;height:3px;background:var(--border);border-radius:2px;}
.ob-progress span.done{background:var(--orange);}
.ob-step{flex:1;display:flex;flex-direction:column;justify-content:center;}
.ob-step h2{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.3;margin-bottom:22px;}
.ob-nav{display:flex;gap:10px;margin-top:20px;}

/* ---------- CORPO / TIMER ---------- */
.timer-root{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 10px 10px;transition:background .3s;}
.timer-seg-label{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:1.2px;margin:14px 0 6px;}
.timer-countdown{font-family:var(--font-mono);font-weight:600;font-size:68px;line-height:1;}
.timer-track{width:100%;max-width:280px;height:6px;background:var(--card-2);border-radius:4px;overflow:hidden;margin-top:24px;}
.timer-bar{height:100%;background:var(--orange);width:100%;transition:width 1s linear;}
.timer-root.rest-mode .timer-bar{background:var(--green);}

.history-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--border);}
.history-row .date{font-size:14px;font-weight:600;}
.history-row .score{font-family:var(--font-mono);font-weight:600;color:var(--orange);}
</style>
</head>
<body>

<div id="onboarding" class="hidden"></div>

<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
  <nav class="bottom-nav" id="bottomnav"></nav>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================
   EVOLVE — Sistema Pessoal de Evolução
   Single-file offline-first PWA. IndexedDB persistence.
   ========================================================= */

/* ---------- IndexedDB layer ---------- */
const DB_NAME = 'evolve_db', DB_VERSION = 3;
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'key'});
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('quotes')) d.createObjectStore('quotes',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('routineItems')) d.createObjectStore('routineItems',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('activities')) d.createObjectStore('activities',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('activityLogs')) d.createObjectStore('activityLogs',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('routineLogs')) d.createObjectStore('routineLogs',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('diaryLogs')) d.createObjectStore('diaryLogs',{keyPath:'date'});
      if(!d.objectStoreNames.contains('dailyScores')) d.createObjectStore('dailyScores',{keyPath:'date'});
      // aiAnalyses: recreated with autoIncrement id to support multiple scopes (dia/semana/período) per date.
      if(d.objectStoreNames.contains('aiAnalyses')) d.deleteObjectStore('aiAnalyses');
      d.createObjectStore('aiAnalyses',{keyPath:'id',autoIncrement:true});
      // Corpo: weight tracking (one entry per date) and interval-timer presets.
      if(!d.objectStoreNames.contains('weightLogs')) d.createObjectStore('weightLogs',{keyPath:'date'});
      if(!d.objectStoreNames.contains('timerPresets')) d.createObjectStore('timerPresets',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function tx(store,mode='readonly'){ return db.transaction(store,mode).objectStore(store); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGet(store,key){ return new Promise((res,rej)=>{ const r=tx(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbPut(store,val){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(val); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbDelete(store,key){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

/* ---------- Date/time utils ---------- */
function pad(n){return n.toString().padStart(2,'0');}
function todayStr(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowHM(d=new Date()){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dowOf(dateStr){ return new Date(dateStr+'T12:00:00').getDay(); } // 0=Sun
function addDays(dateStr,n){ const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function fmtDatePretty(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
}

/* ---------- Global state ---------- */
const S = {
  profile:null, images:[], quotes:[], routineItems:[], activities:[],
  activityLogs:[], routineLogs:[], projects:[], diaryLogs:[], aiAnalyses:[], dailyScores:[],
  weightLogs:[], timerPresets:[],
  geminiApiKey:'', onboardingDone:false, view:'visao', diaryDate:null, diaryScope:'day',
  corpoTab:'peso', timerRun:null
};

async function loadAll(){
  const [profileRow, geminiRow, obRow] = await Promise.all([
    dbGet('settings','profile'), dbGet('settings','geminiApiKey'), dbGet('settings','onboardingDone')
  ]);
  S.profile = profileRow ? profileRow.value : null;
  S.geminiApiKey = geminiRow ? geminiRow.value : '';
  S.onboardingDone = obRow ? obRow.value : false;
  [S.images,S.quotes,S.routineItems,S.activities,S.activityLogs,S.routineLogs,S.projects,S.diaryLogs,S.aiAnalyses,S.dailyScores,S.weightLogs,S.timerPresets] = await Promise.all([

/* =========================================================
   EVOLUTION ENGINE — scheduling, completion, scoring
   ========================================================= */
function routineForDate(dateStr){
  const dow = dowOf(dateStr);
  return S.routineItems.filter(r=>r.active!==false && (!r.days || r.days.length===0 || r.days.includes(dow)))
    .sort((a,b)=>a.time.localeCompare(b.time));
}
function activitiesForDate(dateStr){
  const dow = dowOf(dateStr);
  return S.activities.filter(a=>a.active!==false && (!a.days || a.days.length===0 || a.days.includes(dow)));
}
function routineLogFor(routineId,dateStr){ return S.routineLogs.find(l=>l.routineItemId===routineId && l.date===dateStr); }
function activityLogFor(activityId,dateStr){ return S.activityLogs.find(l=>l.activityId===activityId && l.date===dateStr); }

// Auto-mark routine items whose window has fully elapsed today with no log as "missed"
async function reconcileRoutine(dateStr){
  const items = routineForDate(dateStr);
  const now = nowHM();
  const isToday = dateStr===todayStr();
  for(let i=0;i<items.length;i++){
    const item = items[i];
    const next = items[i+1];
    const windowEnd = next ? next.time : '23:59';
    const elapsed = isToday ? (now >= windowEnd) : true;
    if(elapsed && !routineLogFor(item.id,dateStr)){
      const log = {routineItemId:item.id,date:dateStr,status:'missed',completedAt:null};
      const id = await dbPut('routineLogs',log); log.id=id; S.routineLogs.push(log);
    }
  }
}

async function toggleRoutineDone(routineId,dateStr){
  const existing = routineLogFor(routineId,dateStr);
  if(existing && existing.status==='done'){
    await dbDelete('routineLogs',existing.id);
    S.routineLogs = S.routineLogs.filter(l=>l.id!==existing.id);
  } else {
    if(existing){ existing.status='done'; existing.completedAt=Date.now(); await dbPut('routineLogs',existing); }
    else { const log={routineItemId:routineId,date:dateStr,status:'done',completedAt:Date.now()}; const id=await dbPut('routineLogs',log); log.id=id; S.routineLogs.push(log); }
    toast('Concluído.');
  }
  await recomputeScore(dateStr);
}

async function toggleActivityDone(activityId,dateStr){
  const existing = activityLogFor(activityId,dateStr);
  if(existing){
    await dbDelete('activityLogs',existing.id);
    S.activityLogs = S.activityLogs.filter(l=>l.id!==existing.id);
  } else {
    const log = {activityId,date:dateStr,completedAt:Date.now()};
    const id = await dbPut('activityLogs',log); log.id=id; S.activityLogs.push(log);
    toast('+ progresso');
    updateProjectsForActivity(activityId);
  }
  await recomputeScore(dateStr);
}

function updateProjectsForActivity(activityId){
  // projects auto-track via computed progress at render time; nothing to persist here.
}

function computeDayMetrics(dateStr){
  const routine = routineForDate(dateStr);
  const acts = activitiesForDate(dateStr);
  const routineDone = routine.filter(r=>{const l=routineLogFor(r.id,dateStr);return l && l.status==='done';}).length;
  const rotina = routine.length ? (routineDone/routine.length)*100 : 100;

  const totalWeight = acts.reduce((s,a)=>s+(a.weight||1),0) || 1;
  const doneWeight = acts.reduce((s,a)=> s + (activityLogFor(a.id,dateStr) ? (a.weight||1) : 0),0);
  const habitos = acts.length ? (doneWeight/totalWeight)*100 : 100;

  const execucao = Math.round(rotina*0.5 + habitos*0.5);

  // consistency: last 7 days including this one
  let goodDays=0, countedDays=0;
  for(let i=0;i<7;i++){
    const d = addDays(dateStr,-i);
    if(d>todayStr()) continue;
    countedDays++;
    const score = S.dailyScores.find(s=>s.date===d);
    if(score ? score.evolutionIndex>=60 : false) goodDays++;
    else if(d===dateStr && execucao>=60) goodDays++;
  }
  const consistencia = countedDays ? Math.round((goodDays/countedDays)*100) : 100;

  const disciplina = Math.round(execucao*0.6 + consistencia*0.4);
  const evolutionIndex = Math.round(disciplina*0.3 + rotina*0.25 + consistencia*0.2 + execucao*0.15 + habitos*0.1);

  return { evolutionIndex, disciplina, rotina:Math.round(rotina), consistencia, execucao, habitos:Math.round(habitos) };
}

async function recomputeScore(dateStr){
  const m = computeDayMetrics(dateStr);
  const row = {date:dateStr, ...m};
  await dbPut('dailyScores',row);
  const idx = S.dailyScores.findIndex(s=>s.date===dateStr);
  if(idx>-1) S.dailyScores[idx]=row; else S.dailyScores.push(row);
  return row;
}

function currentStreak(){
  let streak=0, d=todayStr();
  while(true){
    const score = S.dailyScores.find(s=>s.date===d) || computeDayMetrics(d);
    if(score.evolutionIndex>=60){ streak++; d=addDays(d,-1); } else break;
    if(streak>365) break;
  }
  return streak;
}

function missedStreak(){
  let streak=0, d=addDays(todayStr(),-1);
  while(true){
    const score = S.dailyScores.find(s=>s.date===d);
    if(score && score.evolutionIndex<40){ streak++; d=addDays(d,-1); } else break;
    if(streak>30) break;
  }
  return streak;
}

function dynamicMessage(todayMetrics){
  const streak = currentStreak();
  const missed = missedStreak();
  if(missed>=3) return {tone:'strong', text:'Cada dia sem cumprir sua meta é um dia mais longe do seu objetivo.'};
  if(missed>=1 && todayMetrics.evolutionIndex<50) return {tone:'direct', text:'Você está repetindo o mesmo padrão. Talvez esteja na hora de parar de negociar com aquilo que você mesmo decidiu fazer.'};
  if(streak>=7) return {tone:'recognition', text:`${streak} dias seguidos. Você está construindo consistência real.`};
  if(todayMetrics.evolutionIndex>=80) return {tone:'recognition', text:'Você fez o que precisava fazer mesmo sem depender de motivação.'};
  if(todayMetrics.evolutionIndex<50) return {tone:'leve', text:'Hoje não saiu como planejado. Amanhã você tem uma nova oportunidade.'};
  return {tone:'neutral', text:'Você sabe onde quer chegar. Agora precisa agir.'};
}

function animateEvoRing(){
  const circle = document.getElementById('evoRingCircle');
  const numEl = document.getElementById('evoRingNum');
  if(!circle || !numEl) return;
  const target = +circle.dataset.target;
  const targetVal = +numEl.dataset.target;
  // Small delay so the CSS transition on stroke-dashoffset actually triggers on top of the initial paint.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ circle.style.strokeDashoffset = target; }));
  const duration = 900, start = performance.now();
  function tick(now){
    const t = Math.min(1,(now-start)/duration);
    const eased = 1-Math.pow(1-t,3);
    numEl.textContent = Math.round(targetVal*eased);
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

  const hero = document.getElementById('heroImage'); if(!hero) return;

function renderAgora(){
  const today = todayStr();

  if(!items.length){
    return topbarHtml('Agora') + emptyState('◷','Sua rotina começa quando você decide como seu dia deve ser.','Criar rotina','openRoutineForm()');
  }

  let currentIdx = -1;
  for(let i=0;i<items.length;i++){ if(items[i].time<=now) currentIdx=i; }
  const currentItem = currentIdx>-1 ? items[currentIdx] : null;
  const nextItem = items[currentIdx+1] || null;
  const currentLog = currentItem ? routineLogFor(currentItem.id,today) : null;
  const currentStatus = currentLog ? currentLog.status : 'pending';

  const rows = items.map((it,i)=>{
    const log = routineLogFor(it.id,today);
    const status = log ? log.status : (i===currentIdx ? 'now' : (i<currentIdx ? 'missed' : 'upcoming'));
    const cls = status==='done'?'done':(i===currentIdx && status!=='done'?'now':(status==='missed'?'missed':''));
    const tag = status==='done'?'Concluído':(cls==='now'?'Agora':(status==='missed'?'Não concluída':(i===currentIdx+1?'Próximo':'')));
    return `
      <div class="t-item ${cls}">

        <div class="t-title">${it.icon?it.icon+' ':''}${escapeHtml(it.label)}</div>

  return `

function diaryRangeFor(date, scope){
  if(scope==='day') return [date];
  if(scope==='week'){ const arr=[]; for(let i=6;i>=0;i--) arr.push(addDays(date,-i)); return arr; }
  // all: from earliest recorded diary/score entry up to date
  const allDates = [...S.diaryLogs.map(d=>d.date), ...S.dailyScores.map(s=>s.date)].filter(d=>d<=date);
  const earliest = allDates.length ? allDates.sort()[0] : date;
  const arr=[]; for(let d=earliest; d<=date; d=addDays(d,1)){ arr.push(d); if(arr.length>120) break; }
  return arr;
}

    const metricsRange = range.map(d=> S.dailyScores.find(s=>s.date===d) || computeDayMetrics(d));
    const prompt = buildAnalysisPrompt(date, scope, entries, metricsRange);

    const parsed = parseAnalysisJSON(result);

const ANALYSIS_SYSTEM_INSTRUCTION = `Você é um analista pessoal de evolução, disciplina e comportamento — não um coach genérico e não um chatbot de bem-estar.

Regra mais importante: seus conselhos precisam ser PRÁTICOS e ESPECÍFICOS, nunca vagos. Sempre que a pessoa mencionar um evento concreto no diário (ex.: comeu um doce específico e quebrou a dieta, faltou a um treino específico, procrastinou uma tarefa específica, teve um pensamento ou gatilho específico), sua recomendação deve tratar DIRETAMENTE desse evento com uma ação concreta e aplicável — por exemplo, identificar o gatilho e sugerir removê-lo do ambiente, propor um substituto específico, sugerir um horário ou contexto alternativo, ou uma regra simples e mensurável para a próxima vez. NUNCA responda com frases genéricas como "tenha mais força de vontade", "seja mais disciplinado" ou "continue se esforçando" — isso é uma falha grave.

Separe sempre dados observados (o que está literalmente escrito ou registrado) de interpretações (o que você concluiu a partir disso). Nunca invente informações que não estão nos dados fornecidos. Se não houver dados suficientes para identificar um padrão real, diga isso explicitamente em vez de inventar um.

Regras de formato, sem exceção:
- Cada campo deve ter no máximo 2 a 3 frases curtas, em português claro e direto — nunca um texto longo ou acadêmico.
- Escreva em texto corrido, como se estivesse falando com a pessoa. NUNCA use markdown: sem **negrito**, sem listas, sem hífens de tópico, sem títulos, sem emojis.
- Se um campo não se aplica (ex.: ainda não há padrão identificável), escreva uma frase curta dizendo isso — nunca deixe vazio e nunca invente para preencher.
- Responda apenas com os quatro campos pedidos, nada além disso.`;

// Forces the Gemini API itself to return valid, well-shaped JSON (instead of relying only on the
// prompt instruction above) — this is what actually fixes malformed / hard-to-parse responses.
const ANALYSIS_GENERATION_CONFIG = {
  responseMimeType: 'application/json',
  responseSchema: {
    type: 'OBJECT',
    properties: {
      bemFeito: {type:'STRING', description:'2-3 frases curtas, sem markdown, sobre o que a pessoa fez bem.'},
      melhorar: {type:'STRING', description:'2-3 frases curtas, sem markdown, sobre o que precisa melhorar.'},
      padrao: {type:'STRING', description:'2-3 frases curtas, sem markdown, sobre um padrão observado (ou dizendo que ainda não há dados suficientes).'},
      recomendacao: {type:'STRING', description:'2-3 frases curtas, sem markdown, com uma ação prática e específica.'}
    },
    required: ['bemFeito','melhorar','padrao','recomendacao']
  }
};

function buildAnalysisPrompt(date, scope, entries, metricsRange){
  const scopeLabel = scope==='day' ? 'um único dia' : scope==='week' ? 'os últimos 7 dias' : 'todo o período registrado';
  const diaryText = entries.length
    ? entries.map(e=>`--- ${e.date} ---\nManhã: ${e.log.manha||'(vazio)'}\nTarde: ${e.log.tarde||'(vazio)'}\nNoite: ${e.log.noite||'(vazio)'}`).join('\n\n')
    : '(nenhum registro de diário no período)';
  const metricsText = metricsRange.map(m=>`${m.date}: índice ${m.evolutionIndex} (rotina ${m.rotina}, hábitos ${m.habitos}, execução ${m.execucao})`).join('\n');

  return `Analise o período abaixo, que corresponde a ${scopeLabel} (referência: ${date}).

DIÁRIO DO PERÍODO:
${diaryText}

MÉTRICAS DIÁRIAS DO PERÍODO:
${metricsText}

${scope==='day'
  ? 'Como é apenas um dia, procure padrões só se houver métricas históricas suficientes acima; caso contrário, diga que ainda não há histórico suficiente.'
  : 'Como é um período de vários dias, procure ativamente padrões recorrentes entre os dias (por exemplo: mesmo gatilho se repetindo, queda de desempenho em dias específicos, melhora ou piora ao longo do período).'}

Lembre-se: se algum evento específico foi mencionado no diário, sua recomendação deve ser uma ação concreta ligada a esse evento específico, não um conselho genérico.`;
}
function parseAnalysisJSON(text){
  let clean = (text||'').trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  let parsed = null;
  try{ parsed = JSON.parse(clean); }
  catch(e){
    // The model added text before/after the JSON (or wrapped it oddly) — pull out the first {...} block and retry.
    const match = clean.match(/\{[\s\S]*\}/);
    if(match){ try{ parsed = JSON.parse(match[0]); }catch(e2){ parsed = null; } }
  }
  if(!parsed || typeof parsed!=='object'){
    return {bemFeito:clean.slice(0,400)||'Não foi possível interpretar a resposta da IA.',melhorar:'',padrao:'',recomendacao:''};
  }
  const pick = (...keys)=>{ for(const k of keys){ if(parsed[k]) return parsed[k]; } return ''; };
  return {
    bemFeito: sanitizeAnalysisText(pick('bemFeito','bem_feito','wentWell')),
    melhorar: sanitizeAnalysisText(pick('melhorar','improve')),
    padrao: sanitizeAnalysisText(pick('padrao','padrão','pattern')),
    recomendacao: sanitizeAnalysisText(pick('recomendacao','recomendação','recommendation'))
  };
}
// Defensive cleanup in case a fallback model adds markdown despite being told not to.
function sanitizeAnalysisText(s){
  if(!s) return '';
  return String(s)
    .replace(/\*\*(.*?)\*\*/g,'$1')   // **bold**
    .replace(/\*(.*?)\*/g,'$1')       // *italic*
    .replace(/^[\-\*•]\s+/gm,'')      // leading bullet markers
    .replace(/#{1,6}\s+/g,'')         // markdown headings
    .replace(/\n{2,}/g,' ')
    .replace(/\n/g,' ')
    .trim();
}
const GEMINI_FALLBACK_MODELS = ['gemini-2.5-flash','gemini-3.5-flash-lite','gemini-3.6-flash','gemini-2.0-flash','gemini-1.5-flash'];
let _resolvedGeminiModel = null;

async function resolveGeminiModel(){
  if(_resolvedGeminiModel) return _resolvedGeminiModel;
  const cached = await dbGet('settings','geminiModel');
  if(cached && cached.value){ _resolvedGeminiModel = cached.value; return _resolvedGeminiModel; }
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${S.geminiApiKey}`);
    if(res.ok){
      const data = await res.json();
      const names = (data.models||[])
        .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m => m.name.replace('models/',''));
      // Prefer a "flash" model (fast + cheap), avoid vision/embedding/tts/image-only variants.
      const pick = names.find(n => /flash/i.test(n) && !/vision|embed|tts|image|audio/i.test(n))
                 || names.find(n => /pro/i.test(n) && !/vision|embed|tts|image|audio/i.test(n))
                 || names[0];
      if(pick){ _resolvedGeminiModel = pick; await dbPut('settings',{key:'geminiModel',value:pick}); return pick; }
    }
  }catch(e){ /* fall through to hardcoded fallback list */ }
  _resolvedGeminiModel = GEMINI_FALLBACK_MODELS[0];
  return _resolvedGeminiModel;
}

async function callGemini(prompt, systemInstruction, generationConfig){
  const tried = [];
  let candidates = [await resolveGeminiModel(), ...GEMINI_FALLBACK_MODELS];
  candidates = [...new Set(candidates)];
  let lastError = null;
  const body = {contents:[{parts:[{text:prompt}]}]};
  if(systemInstruction) body.system_instruction = {parts:[{text:systemInstruction}]};
  if(generationConfig) body.generationConfig = generationConfig;
  for(const model of candidates){
    if(tried.includes(model)) continue;
    tried.push(model);
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.geminiApiKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if(res.status===404){ lastError=new Error('model not found: '+model); continue; } // model retired — try next
      if(!res.ok){ lastError=new Error('Gemini request failed ('+res.status+')'); continue; }
      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if(text===undefined) { lastError=new Error('empty response'); continue; }
      // Success — remember this model so future calls skip straight to it.
      if(model!==_resolvedGeminiModel){ _resolvedGeminiModel=model; await dbPut('settings',{key:'geminiModel',value:model}); }
      return text;
    }catch(e){ lastError=e; }
  }
  throw lastError || new Error('Nenhum modelo Gemini disponível respondeu.');
}

// Per-day score for a project. If the project has linked activities/routines,
// score is based only on those; otherwise falls back to the overall daily evolution index.
// Returns null when the project has links but nothing was scheduled that day (day excluded from the average).
function projectDayIndex(p, date){
  const hasLinks = (p.linkedActivityIds&&p.linkedActivityIds.length) || (p.linkedRoutineIds&&p.linkedRoutineIds.length);
  if(!hasLinks){
    const sc = S.dailyScores.find(x=>x.date===date) || computeDayMetrics(date);
    return sc.evolutionIndex;
  }
  const dow = dowOf(date);
  let routinePct=null, actPct=null;
  if(p.linkedRoutineIds && p.linkedRoutineIds.length){
    const routinesToday = S.routineItems.filter(r=>p.linkedRoutineIds.includes(r.id) && (!r.days||r.days.length===0||r.days.includes(dow)));
    if(routinesToday.length){
      const done = routinesToday.filter(r=>{const l=routineLogFor(r.id,date);return l&&l.status==='done';}).length;
      routinePct = done/routinesToday.length;
    }
  }
  if(p.linkedActivityIds && p.linkedActivityIds.length){
    const actsToday = S.activities.filter(a=>p.linkedActivityIds.includes(a.id) && (!a.days||a.days.length===0||a.days.includes(dow)));
    if(actsToday.length){
      const totalW = actsToday.reduce((s,a)=>s+(a.weight||1),0)||1;
      const doneW = actsToday.reduce((s,a)=> s+(activityLogFor(a.id,date)?(a.weight||1):0),0);
      actPct = doneW/totalW;
    }
  }
  if(routinePct===null && actPct===null) return null;
  if(routinePct===null) return Math.round(actPct*100);
  if(actPct===null) return Math.round(routinePct*100);
  return Math.round((routinePct*0.5+actPct*0.5)*100);
}
function projectProgress(p){
  const total = daysBetween(p.startDate,p.endDate)+1;
  if(total<=0) return 0;
  let sum=0,count=0;
  for(let d=p.startDate; d<=Math.min(p.endDate,todayStr()); d=addDays(d,1)){
    const idx = projectDayIndex(p,d);
    if(idx!==null){ sum+=idx; count++; }
    if(count>400) break;
  }
  return count ? Math.round(sum/count) : 0;
}
function projectHasLinks(p){ return (p.linkedActivityIds&&p.linkedActivityIds.length) || (p.linkedRoutineIds&&p.linkedRoutineIds.length); }
function renderProjetos(){
  if(!S.projects.length){
    return topbarHtml('Projetos') + emptyState('▲','Você ainda não criou seu próximo desafio.','Criar projeto','openProjectForm()');
  }

    let done=0,incomplete=0,lost=0;

    }
    const linkedActs = (p.linkedActivityIds||[]).map(id=>S.activities.find(a=>a.id===id)).filter(Boolean);

        </div>
      </div>`;
  }).join('');
  return `${topbarHtml('Projetos')}${cards}<button class="btn btn-secondary" onclick="openProjectForm()">+ Novo projeto</button>`;
}

// Trend is always based on the 3 most recent entries (regardless of gaps between their dates).
function computeWeightTrendHtml(sorted){
  if(sorted.length<3){
    return `<div class="sub">Registre pelo menos 3 dias para a análise de tendência aparecer (faltam ${3-sorted.length}).</div>`;
  }
  const last3 = sorted.slice(-3);
  const [w1,w2,w3] = last3.map(w=>w.kg);
  const diff1 = +(w2-w1).toFixed(3);
  const diff2 = +(w3-w2).toFixed(3);
  let headline;
  if(diff2<0 && diff1<0){
    const rhythm = Math.abs(diff2)<Math.abs(diff1) ? 'o ritmo desacelerou' : Math.abs(diff2)>Math.abs(diff1) ? 'o ritmo acelerou' : 'o ritmo está estável';
    headline = `Você está <b style="color:var(--green);">emagrecendo</b>, mas ${rhythm}.`;
  } else if(diff2>0 && diff1>0){
    const rhythm = Math.abs(diff2)<Math.abs(diff1) ? 'o ritmo desacelerou' : Math.abs(diff2)>Math.abs(diff1) ? 'o ritmo acelerou' : 'o ritmo está estável';
    headline = `Você está <b style="color:var(--red);">engordando</b>, e ${rhythm}.`;
  } else if(diff2===0 && diff1===0){
    headline = `Seu peso está <b>estável</b> nos últimos 3 registros.`;
  } else if(diff2===0){
    headline = `Seu peso <b>não mudou</b> no último registro.`;
  } else if(diff1<0 && diff2>0){
    headline = `Mudança de tendência: você vinha <b style="color:var(--green);">emagrecendo</b> e no último registro passou a <b style="color:var(--red);">engordar</b>.`;
  } else {
    headline = `Mudança de tendência: você vinha <b style="color:var(--red);">engordando</b> e no último registro passou a <b style="color:var(--green);">emagrecer</b>.`;
  }
  return `<div style="font-size:14.5px;line-height:1.5;">${headline}</div>
    <div class="sub" style="margin-top:10px;">Baseado nos 3 últimos registros: ${last3.map(w=>w.kg.toFixed(1)+' kg ('+fmtDatePretty(w.date)+')').join(' → ')}</div>`;
}
function weightSparkline(entries){
  if(entries.length<2) return `<div class="sub">Registre mais dias para ver o gráfico de evolução.</div>`;
  const vals = entries.map(e=>e.kg);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const w=280,h=80,pad=8;
  const pts = entries.map((e,i)=>{
    const x = pad + (entries.length>1 ? (i/(entries.length-1))*(w-2*pad) : (w/2));
    const y = h-pad - ((e.kg-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="100%" height="80" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;">
    <polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:6px;">
    <span>${entries[0].kg.toFixed(1)} kg</span><span>${entries[entries.length-1].kg.toFixed(1)} kg</span>
  </div>`;
}

/* ----- Timer engine (runtime only — not persisted) ----- */
let timerIntervalId = null;
// One shared, reused AudioContext. Mobile browsers only allow audio to keep playing from timers/callbacks
// (not a direct tap) on a context that was already unlocked by a real user gesture — creating a fresh
// context per beep (the previous approach) gets silently blocked after the first sound on iOS/Safari.
let audioCtx = null;
function ensureAudioCtx(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    if(!audioCtx) audioCtx = new Ctx();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function beep(freq=880, duration=150){
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type='sine'; osc.frequency.value=freq;
    osc.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+duration/1000);
    osc.start(now); osc.stop(now+duration/1000+0.03);
  }catch(e){ /* audio unavailable — vibration still provides feedback */ }
}
// A short double-beep so the transition between exercise and rest is unmistakable even with the phone in a pocket.
function beepTransition(isExercise){
  beep(isExercise?880:440, 150);
  setTimeout(()=>beep(isExercise?880:440, 150), 220);
}
function flattenSequence(preset){
  const seq = [];
  for(let r=0;r<(preset.loops||1);r++) preset.segments.forEach(seg=>seq.push({...seg}));
  return seq;
}
function startTimer(presetId){
  const preset = S.timerPresets.find(p=>p.id===presetId);
  if(!preset) return;
  ensureAudioCtx(); // unlock audio here, inside the click gesture, so later automatic beeps are allowed
  const sequence = flattenSequence(preset);
  S.timerRun = { presetName:preset.name, sequence, index:0, remaining:sequence[0].seconds, segTotal:sequence[0].seconds, paused:false };
  S.corpoTab = 'running';
  renderMain();
  beepTransition(sequence[0].type==='exercicio');
  if(navigator.vibrate) navigator.vibrate(150);
  runTimerInterval();
}
function runTimerInterval(){
  clearInterval(timerIntervalId);
  timerIntervalId = setInterval(()=>{
    if(!S.timerRun || S.timerRun.paused) return;
    S.timerRun.remaining--;
    if(S.timerRun.remaining<=0) advanceTimerSegment();
    updateTimerDisplay();
  }, 1000);
}
function advanceTimerSegment(){
  S.timerRun.index++;
  if(S.timerRun.index>=S.timerRun.sequence.length){ finishTimer(); return; }
  const seg = S.timerRun.sequence[S.timerRun.index];
  S.timerRun.remaining = seg.seconds;
  S.timerRun.segTotal = seg.seconds;
  beepTransition(seg.type==='exercicio');
  if(navigator.vibrate) navigator.vibrate(seg.type==='exercicio'?[150]:[80,60,80]);
}
function pauseResumeTimer(){
  if(!S.timerRun) return;
  ensureAudioCtx(); // tapping pause/resume is also a user gesture — good moment to re-unlock audio if it got suspended
  S.timerRun.paused = !S.timerRun.paused;
  updateTimerDisplay();
}
function skipTimerSegment(){
  if(!S.timerRun) return;
  advanceTimerSegment();
  updateTimerDisplay();
}
function stopTimerRun(){
  clearInterval(timerIntervalId); timerIntervalId=null;
  if(S.timerRun){ S.timerRun=null; if(S.corpoTab==='running') S.corpoTab='treino'; }
}
function confirmStopTimer(){ stopTimerRun(); renderMain(); }
function finishTimer(){
  clearInterval(timerIntervalId); timerIntervalId=null;
  beep(1200,280);
  if(navigator.vibrate) navigator.vibrate([150,80,150,80,250]);
  toast('Treino concluído.');
  S.timerRun=null; S.corpoTab='treino';
  renderMain();
}
function updateTimerDisplay(){
  if(!S.timerRun){ return; }
  const root = document.getElementById('timerRoot'); if(!root) return;
  const seg = S.timerRun.sequence[S.timerRun.index];
  const m = Math.floor(Math.max(0,S.timerRun.remaining)/60), s = Math.max(0,S.timerRun.remaining)%60;
  const numEl = document.getElementById('timerCountdown'); if(numEl) numEl.textContent = `${m}:${pad(s)}`;
  const lblEl = document.getElementById('timerSegLabel');
  if(lblEl){ lblEl.textContent = segLabelUpper(seg); lblEl.style.color = seg.type==='descanso'?'var(--green)':'var(--orange)'; }
  const idxEl = document.getElementById('timerSegIdx'); if(idxEl) idxEl.textContent = `Bloco ${S.timerRun.index+1}/${S.timerRun.sequence.length}`;
  const barEl = document.getElementById('timerBar'); if(barEl) barEl.style.width = `${Math.max(0,(S.timerRun.remaining/S.timerRun.segTotal)*100)}%`;
  const pauseBtn = document.getElementById('timerPauseBtn'); if(pauseBtn) pauseBtn.textContent = S.timerRun.paused ? '▶ Retomar' : '⏸ Pausar';
  root.classList.toggle('rest-mode', seg.type==='descanso');
}
function renderTimerRunner(){
  if(!S.timerRun) return renderTreinoTab();
  const seg = S.timerRun.sequence[S.timerRun.index];
  const m = Math.floor(S.timerRun.remaining/60), s = S.timerRun.remaining%60;
  return `
    <div id="timerRoot" class="timer-root ${seg.type==='descanso'?'rest-mode':''}">
      <div class="sub" id="timerSegIdx">Bloco ${S.timerRun.index+1}/${S.timerRun.sequence.length}</div>
      <div class="timer-seg-label" id="timerSegLabel" style="color:${seg.type==='descanso'?'var(--green)':'var(--orange)'};">${escapeHtml(segLabelUpper(seg))}</div>
      <div class="timer-countdown" id="timerCountdown">${m}:${pad(s)}</div>
      <div class="timer-track"><div class="timer-bar" id="timerBar" style="width:${(S.timerRun.remaining/S.timerRun.segTotal)*100}%;"></div></div>
      <div style="display:flex;gap:10px;margin-top:26px;width:100%;max-width:280px;">
        <button class="btn btn-secondary" id="timerPauseBtn" onclick="pauseResumeTimer()" style="flex:1;">⏸ Pausar</button>
        <button class="btn btn-ghost" onclick="skipTimerSegment()" style="flex:1;">Pular</button>
      </div>
      <button class="btn btn-danger" style="margin-top:12px;max-width:280px;" onclick="confirmStopTimer()">Encerrar treino</button>
    </div>
  `;
}

async function testGemini(){

    await callGemini('Responda apenas com a palavra: ok');

  }catch(e){ el.innerHTML = `<div class="conn-status err">🔴 Erro de conexão — ${escapeHtml(e.message||'')}</div>`; }

async function requestNotifications(){
  if(!('Notification' in window)){ toast('Notificações não suportadas neste navegador.'); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){ toast('Notificações ativadas.'); await dbPut('settings',{key:'notificationsEnabled',value:true}); startNotificationLoop(); }
  else toast('Permissão negada.');
}
function startNotificationLoop(){
  let lastFired = {};
  setInterval(async ()=>{
    if(Notification.permission!=='granted') return;
    const now = nowHM(), today=todayStr();
    const due = routineForDate(today).filter(r=>{
      const key = r.id+today;
      if(r.time===now && !lastFired[key]){ lastFired[key]=true; return true; }
      return false;
    });
    if(!due.length) return;
    try{
      const reg = await navigator.serviceWorker.ready;
      due.forEach(r=> reg.showNotification('EVOLVE', {body:`Hora de: ${r.label}`, icon:'icon-192.png', badge:'icon-192.png'}));
    }catch(e){ /* service worker unavailable — skip silently */ }
  }, 20000);
}

function addImage(ev){

  const reader = new FileReader();
  reader.onload = async ()=>{
    const rec = {dataUrl:reader.result, isMain:S.images.length===0};
    const id = await dbPut('images',rec); rec.id=id; S.images.push(rec);
    document.getElementById('imgGrid').innerHTML = renderImgGrid();
    renderMain();
  };
  reader.readAsDataURL(file);
}
async function setMainImage(id){
  S.images.forEach(i=>i.isMain=(i.id===id));
  await Promise.all(S.images.map(i=>dbPut('images',i)));
  document.getElementById('imgGrid').innerHTML = renderImgGrid(); renderMain();
}
async function deleteImage(id){
  await dbDelete('images',id); S.images=S.images.filter(i=>i.id!==id);
  if(S.images.length && !S.images.some(i=>i.isMain)){ S.images[0].isMain=true; await dbPut('images',S.images[0]); }
  document.getElementById('imgGrid').innerHTML = renderImgGrid(); renderMain();
}

function openQuoteManager(){
  openModal(`
    <h2>Frases</h2>
    <div class="field-row"><div class="field" style="flex:3;"><input id="quoteInput" placeholder="Nova frase"></div>
      <button class="btn btn-primary" style="width:auto;flex:1;" onclick="addQuote()">+</button></div>
    <div id="quoteList">${renderQuoteList()}</div>
  `);
}
function renderQuoteList(){
  return S.quotes.map(q=>`
    <div class="list-row"><div class="name">${q.isFavorite?'★ ':''}${escapeHtml(q.text)}</div>
      <div class="actions"><button onclick="favQuote(${q.id})">favoritar</button><button onclick="delQuote(${q.id})">excluir</button></div>
    </div>`).join('');
}
async function addQuote(){
  const text = document.getElementById('quoteInput').value.trim(); if(!text) return;
  const rec = {text, isFavorite:S.quotes.length===0};
  const id = await dbPut('quotes',rec); rec.id=id; S.quotes.push(rec);
  document.getElementById('quoteInput').value='';
  document.getElementById('quoteList').innerHTML = renderQuoteList(); renderMain();
}
async function favQuote(id){
  S.quotes.forEach(q=>q.isFavorite=(q.id===id));
  await Promise.all(S.quotes.map(q=>dbPut('quotes',q)));
  document.getElementById('quoteList').innerHTML = renderQuoteList(); renderMain();
}
async function delQuote(id){
  await dbDelete('quotes',id); S.quotes=S.quotes.filter(q=>q.id!==id);
  document.getElementById('quoteList').innerHTML = renderQuoteList(); renderMain();
}

const WEEKDAYS = ['D','S','T','Q','Q','S','S'];
function daySelector(fieldId, selected){
  selected = selected||[];
  return `<div class="chip-row" id="${fieldId}">${WEEKDAYS.map((d,i)=>`<button type="button" class="chip ${selected.includes(i)?'selected':''}" onclick="this.classList.toggle('selected')" data-day="${i}">${d}</button>`).join('')}</div>`;
}
function readDaySelector(fieldId){
  return [...document.querySelectorAll(`#${fieldId} .chip.selected`)].map(c=>+c.dataset.day);
}

function openRoutineForm(id){
  const r = id ? S.routineItems.find(x=>x.id===id) : null;
  openModal(`
    <h2>${r?'Editar horário':'Novo horário'}</h2>
    <div class="field-row">
      <div class="field"><label>Horário</label><input type="time" id="r-time" value="${r?r.time:'07:00'}"></div>
      <div class="field" style="flex:2;"><label>Ícone (emoji, opcional)</label><input id="r-icon" value="${r?r.icon||'':''}" placeholder="🚿"></div>
    </div>
    <div class="field"><label>Atividade</label><input id="r-label" value="${r?r.label:''}" placeholder="Ex: Banho e preparação"></div>
    <div class="field"><label>Dias da semana</label>${daySelector('r-days', r?r.days:[0,1,2,3,4,5,6])}</div>
    <button class="btn btn-primary" onclick="saveRoutine(${id||'null'})">Salvar</button>
  `);
}
async function saveRoutine(id){
  const rec = { time:document.getElementById('r-time').value, icon:document.getElementById('r-icon').value.trim(),
    label:document.getElementById('r-label').value.trim(), days:readDaySelector('r-days'), active:true };
  if(id){ rec.id=id; }
  const newId = await dbPut('routineItems',rec); rec.id=id||newId;
  const idx = S.routineItems.findIndex(r=>r.id===rec.id);
  if(idx>-1) S.routineItems[idx]=rec; else S.routineItems.push(rec);
  closeModal(); goTo(S.view);
}
async function deleteRoutine(id){
  await dbDelete('routineItems',id); S.routineItems=S.routineItems.filter(r=>r.id!==id);
  goTo(S.view);
}

function openActivityForm(id){
  const a = id ? S.activities.find(x=>x.id===id) : null;
  openModal(`
    <h2>${a?'Editar atividade':'Nova atividade'}</h2>
    <div class="field"><label>Nome</label><input id="a-name" value="${a?a.name:''}" placeholder="Ex: Musculação"></div>

async function saveActivity(id){

async function deleteActivity(id){

function multiSelectChips(fieldId, items, selectedIds, labelFn){
  if(!items.length) return `<div class="sub">Nenhuma cadastrada ainda.</div>`;
  return `<div class="chip-row" id="${fieldId}">${items.map(it=>`<button type="button" class="chip ${selectedIds.includes(it.id)?'selected':''}" onclick="this.classList.toggle('selected')" data-id="${it.id}">${escapeHtml(labelFn(it))}</button>`).join('')}</div>`;
}
function readMultiSelectChips(fieldId){
  return [...document.querySelectorAll(`#${fieldId} .chip.selected`)].map(c=>+c.dataset.id);
}
function openProjectForm(id){
  const p = id ? S.projects.find(x=>x.id===id) : null;

    <div class="field-row">
      <div class="field"><label>Início</label><input type="date" id="p-start" value="${p?p.startDate:todayStr()}"></div>

async function saveProject(id){

async function deleteProject(id){
  await dbDelete('projects',id); S.projects=S.projects.filter(p=>p.id!==id);
  goTo(S.view);
}

/* =========================================================
   ONBOARDING
   ========================================================= */
const OB_STEPS = [
  {key:'name', q:'Como devemos chamar você?', type:'text', ph:'Seu nome'},
  {key:'conquer', q:'O que você quer conquistar?', type:'text', ph:'Ex: Construir uma vida da qual eu tenha orgulho'},
  {key:'mainGoal', q:'Qual é seu principal objetivo neste momento?', type:'text', ph:'Descreva em uma frase'},
  {key:'habit', q:'Qual hábito você quer desenvolver?', type:'text', ph:'Ex: Treinar todos os dias'},
  {key:'project30', q:'Deseja criar um projeto de 30 dias para começar agora?', type:'choice'}
];
let obIdx=0, obAnswers={};
function renderOnboardingStep(){
  const step = OB_STEPS[obIdx];
  const el = document.getElementById('onboarding');
  const progress = OB_STEPS.map((_,i)=>`<span class="${i<=obIdx?'done':''}"></span>`).join('');
  let body;
  if(step.type==='choice'){
    body = `<div style="display:flex;gap:10px;"><button class="btn btn-primary" onclick="obAnswers['${step.key}']=true;obNext()">Sim, criar</button>
      <button class="btn btn-secondary" onclick="obAnswers['${step.key}']=false;obNext()">Agora não</button></div>`;
  } else {
    body = `<div class="field"><input id="ob-input" placeholder="${step.ph}" value="${obAnswers[step.key]||''}"></div>
      <button class="btn btn-primary" onclick="obTextNext()">Continuar</button>`;
  }
  el.innerHTML = `<div class="ob-progress">${progress}</div><div class="ob-step"><h2>${step.q}</h2>${body}</div>`;
  setTimeout(()=>{const i=document.getElementById('ob-input'); if(i) i.focus();},50);
}
function obTextNext(){
  const step = OB_STEPS[obIdx];
  obAnswers[step.key] = document.getElementById('ob-input').value.trim();
  obNext();
}
async function obNext(){
  obIdx++;
  if(obIdx>=OB_STEPS.length){ await finishOnboarding(); return; }
  renderOnboardingStep();
}
async function finishOnboarding(){
  S.profile = {name:obAnswers.name||'', mainGoal:obAnswers.mainGoal||obAnswers.conquer||'', startDate:todayStr()};
  await dbPut('settings',{key:'profile',value:S.profile});
  if(obAnswers.habit){
    const act = {name:obAnswers.habit, goal:'', time:'', weight:2, days:[0,1,2,3,4,5,6], active:true};
    const id = await dbPut('activities',act); act.id=id; S.activities.push(act);
  }
  if(obAnswers.conquer){
    const q = {text:obAnswers.conquer, isFavorite:true};
    const id = await dbPut('quotes',q); q.id=id; S.quotes.push(q);
  }
  if(obAnswers.project30){
    const p = {name:'Projeto 30 dias', objective:obAnswers.mainGoal||'', description:'', startDate:todayStr(), endDate:addDays(todayStr(),29), archived:false};
    const id = await dbPut('projects',p); p.id=id; S.projects.push(p);
  }
  await dbPut('settings',{key:'onboardingDone',value:true});
  S.onboardingDone = true;
  document.getElementById('onboarding').classList.add('hidden');
  startApp();
}

/* =========================================================
   BOOTSTRAP
   ========================================================= */
async function startApp(){
  document.getElementById('app').classList.add('ready');
  await reconcileRoutine(todayStr());
  await recomputeScore(todayStr());
  S.view='visao';
  renderShell();
  renderMain();
}

const SW_SOURCE = `
const CACHE_NAME = 'evolve-cache-v1';
self.addEventListener('install', (event) => { self.skipWaiting(); });
self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});
self.addEventListener('fetch', (event) => {
  const url = event.request.url;
  if (url.includes('generativelanguage.googleapis.com')) return;
  if (event.request.method !== 'GET') return;
  event.respondWith(
    caches.open(CACHE_NAME).then((cache) =>
      fetch(event.request).then((res) => { cache.put(event.request, res.clone()); return res; })
        .catch(() => cache.match(event.request))
    )
  );
});
`;
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const blob = new Blob([SW_SOURCE], {type:'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{ /* SW registration unsupported here — app still works via IndexedDB */ });
  }catch(e){ /* Blob-based SW not supported in this browser — safe to ignore, app is fully functional without it */ }
}

(async function init(){
  db = await openDB();
  await loadAll();
  registerServiceWorker();
  if(!S.onboardingDone){
    document.getElementById('onboarding').classList.remove('hidden');
    obIdx=0; obAnswers={};
    renderOnboardingStep();
  } else {
    startApp();
  }
})();
</script>
